<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SIT725 3.2P</title>

  <!-- Materialize CSS -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

  <!-- Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- NAVBAR -->
  <nav>
    <div class="nav-wrapper teal">
      <a href="#" class="brand-logo center">My Recipes</a>
    </div>
  </nav>

  <!-- CONTENT -->
  <div class="container" style="margin-top:60px">

    <div class="row">
      <div class="col s12 center-align">
        <a class="btn-large teal modal-trigger" href="#modal1">
          <i class="material-icons left">add</i>
          ADD RECIPE
        </a>
      </div>
    </div>

    <!-- CARDS -->
    <div class="row" id="card-section"></div>
    <div class="card">
</div>



  <!-- MODAL -->
  <div id="modal1" class="modal">
    <div class="modal-content">
      <h5>Add Recipe</h5>

      <div class="input-field">
        <input id="recipe_name" type="text">
        <label for="recipe_name">Recipe Name</label>
      </div>

      <div class="input-field">
        <input id="recipe_desc" type="text">
        <label for="recipe_desc">Description</label>
      </div>

      <div class="center-align">
        <a class="btn green" id="formSubmit">Submit</a>
      </div>
    </div>
  </div>

  <!-- JS ORDER MATTERS -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="js/scripts.js"></script>

</body>
</html>
